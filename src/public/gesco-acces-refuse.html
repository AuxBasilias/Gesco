                <script>
                (function () {
                    var reason = document.getElementById("error-reason");
                    try {
                        if (sessionStorage.getItem("gesco_login_required") === "1") {
                            sessionStorage.removeItem("gesco_login_required");
                            if (reason) reason.textContent = "Vous n'êtes pas connecté ou votre session a expiré.";
                        } else if (reason) {
                            reason.textContent = "Cette page est réservée aux utilisateurs connectés.";
                        }
                    } catch (e) {}
                    // Si l'utilisateur a un token valide, retour au tableau de bord
                    var token = null;
                    try {
                        token = sessionStorage.getItem("tt_token") || localStorage.getItem("token");
                    } catch (e) {}
                    if (token) {
                        try {
                            var parts = token.split(".");
                            var payload = parts.length === 3 ? JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"))) : null;
                            if (payload && (!payload.exp || payload.exp * 1000 > Date.now())) {
                                window.location.replace("gesco-dashboard.html");
                            }
                        } catch (e) {}
                    }
                })();
                </script>
